<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<meta name="theme-color" content="#8E2B2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Owner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../ikon/owner-192.png">
<link rel="apple-touch-icon" href="../ikon/owner-apple-180.png">
<title>Bayumas — Dashboard Owner</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#8E2B2B}
  #gulir{position:fixed;top:0;right:0;bottom:0;left:0;overflow:auto;-webkit-overflow-scrolling:touch;
         top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom)}
  body.ada-pasang #gulir{bottom:54px;bottom:calc(54px + env(safe-area-inset-bottom))}
  #pasang{display:none;position:fixed;left:0;right:0;bottom:0;z-index:3;background:#8E2B2B;color:#fff;
          padding:8px 10px 8px 14px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;line-height:1.35;
          align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
  #pasang.tampil{display:flex}
  #pasang img{width:34px;height:34px;border-radius:8px;margin-right:10px;flex:0 0 auto}
  #pasang .tx{flex:1;min-width:0}
  #pasang button{border:0;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;min-height:38px;margin-left:8px}
  #pasang-ok{background:#FFC051;color:#5A1A1A;padding:0 14px}
  #pasang-x{background:transparent;color:#fff;opacity:.8;font-size:20px;padding:0 6px}
  #izin{position:fixed;left:0;right:0;bottom:0;z-index:4;display:none;align-items:center;
        padding:11px 13px;background:#5A1A1A;color:#fff;font-size:13px;line-height:1.4;
        padding-bottom:calc(11px + env(safe-area-inset-bottom))}
  #izin.tampil{display:flex}
  #izin .tx{flex:1;min-width:0}
  #izin button{border:0;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;
               min-height:38px;margin-left:8px;font-family:inherit}
  #izin-ok{background:#FFC051;color:#5A1A1A;padding:0 14px}
  #izin-x{background:transparent;color:#fff;opacity:.8;font-size:20px;padding:0 6px}
  iframe{border:0;display:block;width:100%;height:100%}
  #memuat{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;
          justify-content:center;background:#8E2B2B;color:#fff;font-family:-apple-system,
          BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;gap:14px;z-index:2}
  #memuat .ic{font-size:52px}
  #memuat .tx{font-size:14px;font-weight:700;opacity:.9}
  #memuat.pergi{display:none}
  #memuat .lambat{display:none;font-size:12px;opacity:.75;max-width:260px;text-align:center;line-height:1.5;padding:0 20px}
  #memuat.tunggu .lambat{display:block}
</style>
</head>
<body>

<div id="memuat"><div class="ic">📊</div><div class="tx">Memuat dashboard…</div><div class="lambat">Sinyal sedang lambat, halaman masih dimuat. Tidak perlu ditutup.</div></div>
<script>setTimeout(function () { var m = document.getElementById('memuat'); if (m && m.className.indexOf('pergi') < 0) m.className += ' tunggu'; }, 8000);</script>

<div id="izin">
  <div class="tx">Tampilkan angka di ikon aplikasi kalau ada yang perlu dikerjakan?</div>
  <button id="izin-ok" type="button">Aktifkan</button>
  <button id="izin-x" type="button" aria-label="Tutup">&times;</button>
</div>

<div id="gulir">
<iframe id="app"
        src="https://script.google.com/macros/s/AKfycbzx2_emp9dDaOUI7LZb4fMTDKqY-DEErFe7wAvuwxHHaWZCosQU_SEN4hKug7qccG46Kg/exec?page=owner"
        allow="camera; clipboard-write"
        onload="document.getElementById('memuat').classList.add('pergi')"></iframe>
</div>

<div id="pasang">
  <img src="../ikon/owner-192.png" alt="">
  <div class="tx" id="pasang-tx">Pasang Dashboard Owner di layar utama HP</div>
  <button id="pasang-ok" type="button">Pasang</button>
  <button id="pasang-x" type="button" aria-label="Tutup">&times;</button>
</div>

<script>
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('../sw.js', { scope: '../' })['catch'](function () {});
    });
  }


  // ── ANGKA DI IKON (BADGE) ──
  //
  // Isinya dihitung di dalam aplikasi, tapi yang boleh memasang badge
  // cuma halaman TERATAS. Aplikasinya sendiri berjalan di dalam iframe
  // milik Google, jadi angkanya dikirim ke sini lewat postMessage.
  //
  // Dua syarat di luar kendali kita: app harus sudah dipasang ke
  // homescreen, dan di iPhone izin notifikasi harus diberikan. Kalau
  // salah satu tidak terpenuhi, badge-nya diam saja - tidak boleh
  // sampai menggagalkan apa pun.
  var ASAL_GOOGLE = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/;

  function pasangBadge(n) {
    try {
      if (!('setAppBadge' in navigator)) return;
      if (n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge();
    } catch (e) { /* ditolak browser - abaikan */ }
  }

  window.addEventListener('message', function (e) {
    if (!ASAL_GOOGLE.test(e.origin)) return;          // hanya dari aplikasi kita
    var d = e.data;
    if (!d || d.bayumas !== 'badge') return;
    pasangBadge(Number(d.n) || 0);
  });

  // ── izin notifikasi ──
  // Di iPhone badge tidak muncul tanpa izin ini, dan izinnya cuma bisa
  // diminta dari ketukan orangnya - bukan dari pesan iframe.
  var kunciIzin = 'bayumas-badge-izin-ditutup';
  function siapkanIzin() {
    if (!('setAppBadge' in navigator) || !('Notification' in window)) return;
    if (Notification.permission !== 'default') return;
    try { if (localStorage.getItem(kunciIzin)) return; } catch (e) { /* mode privat */ }

    var bar = document.getElementById('izin');
    if (!bar) return;
    bar.className = 'tampil';
    document.getElementById('izin-ok').onclick = function () {
      bar.className = '';
      try { Notification.requestPermission(); } catch (e) { /* browser lama */ }
    };
    document.getElementById('izin-x').onclick = function () {
      bar.className = '';
      try { localStorage.setItem(kunciIzin, '1'); } catch (e) { /* mode privat */ }
    };
  }
  setTimeout(siapkanIzin, 2500);

  // Tanpa sinyal, iframe Google hanya menampilkan halaman error browser.
  // Lebih jelas kalau layar pembuka yang memberi tahu.
  var memuat = document.getElementById('memuat');
  function cekSinyal() {
    if (navigator.onLine !== false) return;
    memuat.className = 'tunggu';
    memuat.querySelector('.tx').textContent = 'Tidak ada sinyal internet';
    memuat.querySelector('.lambat').textContent = 'Nyalakan data seluler atau WiFi. Halaman dimuat ulang otomatis begitu tersambung.';
  }
  cekSinyal();
  window.addEventListener('online', function () {
    if (memuat.className.indexOf('pergi') >= 0) return;
    location.reload();
  });

  // ---- tombol Pasang ----
  var mandiri = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                window.navigator.standalone === true;
  if (mandiri) return;

  var KUNCI = 'pasangTutupSampai-owner';
  try { if (Number(localStorage.getItem(KUNCI) || 0) > Date.now()) return; } catch (e) {}

  var bar = document.getElementById('pasang');
  var ok = document.getElementById('pasang-ok');
  var teks = document.getElementById('pasang-tx');
  var tunda = null;

  function tampil() { bar.className = 'tampil'; document.body.className = 'ada-pasang'; }
  function tutup(hari) {
    bar.className = ''; document.body.className = '';
    try { localStorage.setItem(KUNCI, String(Date.now() + hari * 86400000)); } catch (e) {}
  }

  // Android (Chrome, Samsung Internet, Edge): browser sendiri yang
  // memasang, tombol ini hanya memanggilnya.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    tunda = e;
    ok.style.display = '';
    tampil();
  });
  ok.onclick = function () {
    if (!tunda) return;
    tunda.prompt();
    tunda.userChoice.then(function (r) { tutup(r.outcome === 'accepted' ? 3650 : 7); tunda = null; });
  };
  document.getElementById('pasang-x').onclick = function () { tutup(7); };
  window.addEventListener('appinstalled', function () { tutup(3650); });

  // iPhone tidak punya tombol pasang otomatis - hanya bisa lewat menu
  // Bagikan. Jadi yang ditampilkan petunjuknya.
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    ok.style.display = 'none';
    teks.innerHTML = 'Pasang di layar utama: ketuk <b>Bagikan</b> &#x2B06;&#xFE0F; lalu <b>Tambah ke Layar Utama</b>';
    setTimeout(tampil, 2500);
  }
})();
</script>

</body>
</html>
